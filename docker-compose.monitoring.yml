services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ['127.0.0.1:9090:9090']
    volumes: ['./lab13/prometheus.yml:/etc/prometheus/prometheus.yml:ro','./lab13/alerts.yml:/etc/prometheus/alerts.yml:ro']
  grafana:
    image: grafana/grafana:11.5.2
    ports: ['127.0.0.1:3001:3000']
    volumes: ['./lab13/datasource.yml:/etc/grafana/provisioning/datasources/default.yml:ro','./lab13/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/default.yml:ro','./lab13/dashboard.json:/var/lib/grafana/dashboards/event.json:ro']
