apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-event
spec:
  replicas: 3
  selector:
    matchLabels: {app: social-event}
  template:
    metadata:
      labels: {app: social-event}
    spec:
      containers:
        - name: app
          image: social-event:1.0
          imagePullPolicy: Never
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /health, port: 3000}
          livenessProbe:
            httpGet: {path: /health, port: 3000}
